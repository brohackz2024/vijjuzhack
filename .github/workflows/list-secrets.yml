name: List Environment and Repository Secrets

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment name to list secrets for (leave blank to skip environment secrets)'
        required: false
        default: ''

jobs:
  list-repository-secrets:
    name: List Repository Secrets
    runs-on: ubuntu-latest
    permissions:
      secrets: read
    steps:
      - name: List repository secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Repository Secrets ==="
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/actions/secrets \
            --jq '.secrets[] | .name'

  list-environment-secrets:
    name: List Environment Secrets
    runs-on: ubuntu-latest
    permissions:
      secrets: read
    if: ${{ github.event.inputs.environment != '' }}
    steps:
      - name: List environment secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          if [[ ! "$ENVIRONMENT" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "Error: Invalid environment name. Only alphanumeric characters, hyphens, and underscores are allowed."
            exit 1
          fi
          echo "=== Environment Secrets for '${ENVIRONMENT}' ==="
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/environments/${ENVIRONMENT}/secrets" \
            --jq '.secrets[] | .name'
